refLinksErrorLevel = "WARNING"
refLinksNotFoundURL = "/posts/"
baseURL = "https://blog.rkr-networks.com/"
locale = "en-US"
title = "RKR Networks Blog"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changeFreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[services.rss]
  limit = 20

[caches.images]
  dir = ":cacheDir/images"

[params]
  env = "production"          # PaperMod: emits Open Graph, Twitter card and schema.org meta
  title = "RKR Networks Blog"
  description = "News, ideas and updates from RKR Networks. We build synthetic twins for all. By all, we mean switching, routing, wireless, firewalls and security, data centers, power and cooling, and compute. Campus to cloud, one synthetic twin."
  searchDescription = "RKR Networks builds synthetic twins for all: switching, routing, wireless, security, data centers, power and compute. Campus to cloud."
  keywords = ["RKR Networks", "RKR SETU", "synthetic twin", "networking", "data center", "network security", "compute"]
  author = "RKR Networks"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "RKR Networks Blog"
    Content = "News, ideas and updates from [RKR Networks](https://www.rkr-networks.com). We build synthetic twins for all.\\\nBy all, we mean switching, routing, wireless, firewalls and security, data centers, power and cooling, and compute. Campus to cloud, one synthetic twin.\\\nQuestions? Email [sales@rkr-networks.com](mailto:sales@rkr-networks.com)."

  [[params.socialIcons]]
    name = "website"
    url = "https://www.rkr-networks.com"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:sales@rkr-networks.com"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 10
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 20
[[menu.main]]
  name = "RKR Networks"
  url = "https://www.rkr-networks.com"
  weight = 30
[[menu.main]]
  name = "Contact"
  url = "mailto:sales@rkr-networks.com"
  weight = 40
