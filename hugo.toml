refLinksErrorLevel = "WARNING"
refLinksNotFoundURL = "/posts/"
baseURL = "https://blog.rkr-networks.com/"
locale = "en-US"
title = "RKR Networks Blog"
theme = "PaperMod"
enableRobotsTXT = false
copyright = "© 2026 RKR Networks LLC. All rights reserved. No AI training or reuse without written permission."
enableGitInfo = true

[pagination]
  pagerSize = 10

[outputs]
  # No JSON search index: it was a full-text dump of every post and the site has no search page.
  home = ["HTML", "RSS"]

[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[taxonomies]
  tag = "tags"
  category = "categories"

[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "keywords"
    weight = 40

[sitemap]
  changeFreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[services.rss]
  limit = 20

[caches.images]
  dir = ":cacheDir/images"


[params]
  env = "production"          # PaperMod: emits Open Graph, Twitter card and schema.org meta
  title = "RKR Networks Blog"
  description = "News, ideas and updates from RKR Networks. We build synthetic twins for all. By all, we mean switching, routing, wireless, firewalls and security, data centers, power and cooling, and compute. Campus to cloud, one synthetic twin."
  searchDescription = "RKR Networks builds synthetic twins for all: switching, routing, wireless, security, data centers, power and compute. Campus to cloud."
  keywords = ["RKR Networks", "RKR SETU", "synthetic twin", "networking", "data center", "network security", "compute"]
  author = "RKR Networks"
  defaultTheme = "light"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowToc = true
  TocOpen = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  mainSections = ["posts"]
  ShowFullTextinRSS = false   # RSS stays summary-only (description), never full text
  ogImage = "/images/og-default.jpg"
  ogImageWidth = 1200
  ogImageHeight = 630

  [params.organization]
    name = "RKR Networks"
    legalName = "RKR Networks LLC"
    url = "https://www.rkr-networks.com"
    logo = "/images/logo.png"
    email = "sales@rkr-networks.com"
    sameAs = [
      "https://www.rkr-networks.com",
      "https://www.linkedin.com/company/104405241/",
      "https://www.youtube.com/@RKRNetworksOfficial",
      "https://x.com/rkrnetworks",
    ]

  # Topic hubs: menu + "Filed under" links on posts. category = the Hugo category name.
  [[params.hubs]]
    name = "RKR SETU"
    url = "/setu/"
    category = "RKR SETU"
  [[params.hubs]]
    name = "Wi-Fi"
    url = "/wifi/"
    category = "Wi-Fi"
  [[params.hubs]]
    name = "Change rehearsal"
    url = "/change-rehearsal/"
    category = "Change rehearsal"
  [[params.hubs]]
    name = "Data center"
    url = "/data-center/"
    category = "Data center"
  [[params.hubs]]
    name = "Outages and failover"
    url = "/outages-and-failover/"
    category = "Outages and failover"
  [[params.hubs]]
    name = "Podcast"
    url = "/podcast/"
    category = "Podcast"

  [params.label]
    text = "RKR Networks Blog"
    icon = "/images/logo.png"
    iconHeight = 30

  [params.assets]
    theme_color = "#F5F8FB"
    msapplication_TileColor = "#08142E"

  [params.hero]
    kicker = "RKR Networks Blog"
    title = "We build synthetic twins for all."
    subtitle = "By all, we mean switching, routing, wireless, firewalls and security, data centers, power and cooling, and compute. Campus to cloud, one synthetic twin."
    ctaText = "Demos are in person. Book a demo with our team:"
    ctaEmail = "sales@rkr-networks.com"

  [[params.socialIcons]]
    name = "website"
    url = "https://www.rkr-networks.com"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:sales@rkr-networks.com"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

