{{- with site.Params.hero }}
<section class="home-hero" aria-labelledby="hero-title">
  <p class="hero-kicker">{{ .kicker | default site.Title }}</p>
  <h1 id="hero-title" class="hero-title">{{ .title }}</h1>
  {{- with .subtitle }}
  <p class="hero-sub">{{ . }}</p>
  {{- end }}
  {{- with .ctaText }}
  <p class="hero-cta">
    <span>{{ . }}</span>
    {{ with $.Site.Params.hero.ctaEmail }}<a class="hero-cta-link" href="mailto:{{ . }}">{{ . }}</a>{{ end }}
  </p>
  {{- end }}
</section>
{{- end }}
