{{- /* Twitter / X card. Overrides PaperMod's: always a large image card with alt text. */ -}}
{{- $img := partial "social_image.html" . }}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@rkrnetworks">
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title | plainify }}{{ end }}">
<meta name="twitter:description" content="{{ partial "seo_description.html" . }}">
<meta name="twitter:image" content="{{ $img.url }}">
<meta name="twitter:image:alt" content="{{ $img.alt }}">
