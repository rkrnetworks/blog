{{- /* End-of-post demo block. Copy comes from [params.hero]. Hide on a post with hideDemoCta: true. */ -}}
{{- with site.Params.hero }}
<aside class="post-cta" aria-label="Book a demo">
  {{- partial "mini_twin.html" . }}
  <div>
    <p class="post-cta-title">{{ .title }}</p>
    <p class="post-cta-line">{{ .ctaText }}</p>
    {{- with .ctaEmail }}
    <a class="btn-demo" href="mailto:{{ . }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
      {{ . }}
    </a>
    {{- end }}
  </div>
</aside>
{{- end }}
