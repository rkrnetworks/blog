{{- /* Copy link, device share sheet, and the side rail that shows while the reader is in the body of a post. */ -}}
<script>
(function(){var st=document.querySelectorAll(".rkr-share-status");
function say(t){st.forEach(function(s){s.textContent=t;clearTimeout(s._t);s._t=setTimeout(function(){s.textContent=""},2400)})}
document.querySelectorAll("[data-copy]").forEach(function(b){b.addEventListener("click",function(){var u=b.getAttribute("data-copy");function ok(){document.querySelectorAll("[data-copy]").forEach(function(x){x.classList.add("is-done")});say("Link copied");setTimeout(function(){document.querySelectorAll("[data-copy]").forEach(function(x){x.classList.remove("is-done")})},2000)}
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(u).then(ok,function(){prompt("Copy this link:",u)})}else{prompt("Copy this link:",u)}})});
if(navigator.share){document.querySelectorAll("[data-native]").forEach(function(b){b.hidden=false;b.addEventListener("click",function(){navigator.share({title:b.getAttribute("data-title"),url:b.getAttribute("data-url")}).catch(function(){})})})}
var rail=document.querySelector("[data-share-rail]"),head=document.querySelector(".post-header"),end=document.querySelector(".post-footer");
if(rail&&head&&end){var q=false;function u(){q=false;var past=head.getBoundingClientRect().bottom<0,atEnd=end.getBoundingClientRect().top<innerHeight;rail.classList.toggle("is-on",past&&!atEnd)}
function k(){if(!q){q=true;requestAnimationFrame(u)}}addEventListener("scroll",k,{passive:true});addEventListener("resize",k);u()}
})();
</script>
